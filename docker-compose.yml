services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: librarycatalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # The API waits on this rather than on a fixed sleep, so startup is
      # deterministic instead of "usually long enough".
      test: ['CMD-SHELL', 'pg_isready -U postgres -d librarycatalog']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: 'Host=db;Port=5432;Database=librarycatalog;Username=postgres;Password=postgres'
      Cors__AllowedOrigins__0: 'http://localhost:5173'
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./frontend
      args:
        # The browser runs on the host, so it reaches the API through the
        # published port — not through the compose network alias.
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - '5173:80'
    depends_on:
      - api

volumes:
  db-data:
